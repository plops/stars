[package]
name = "stars"
version = "0.1.0"
edition = "2021"
authors = ["wol pumba <wolpumba@gmail.com>"]
description = "iPhone Star Recognition, Astrometry, EXIF Validation, Aberration & Satellite Tracker"

[dependencies]
image = "0.25"
kamadak-exif = "0.6"
ratatui = "0.30"
crossterm = "0.28"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.35"
kiddo = "5.0"
sgp4 = "2.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
base64 = "0.23"

[dev-dependencies]
tokio-test = "0.4"
