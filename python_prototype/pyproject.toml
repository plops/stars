[project]
name = "plate-solve-validator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wol pumba", email = "wolpumba@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=7.2.2",
    "astroquery>=0.4.11",
    "exifread>=3.5.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "photutils>=3.0.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "scipy>=1.18.0",
    "twirl>=0.5.2",
]

[project.scripts]
plate-solve-validator = "plate_solve_validator:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
